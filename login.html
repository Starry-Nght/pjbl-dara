<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Login - Dara Catering</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=block" rel="stylesheet" />
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
	<style>
		:root {
			--surface: #f5f5f5;
			--surface-2: #ececec;
			--brand: #c96d1d;
			--text: #101010;
			--muted: #5e5e5e;
			--line: #d6d6d6;
			--accent: #8b2f16;
			--good: #0a7b41;
			--radius-lg: 26px;
			--radius-md: 18px;
			--radius-sm: 12px;
			--shadow: 0 14px 35px rgba(0, 0, 0, 0.14);
		}

		* {
			box-sizing: border-box;
		}

		html {
			scroll-behavior: smooth;
		}

		body {
			margin: 0;
			font-family: "Manrope", sans-serif;
			color: var(--text);
			background:
				radial-gradient(1000px 500px at -20% 10%, #ece2d4 0%, transparent 70%),
				radial-gradient(900px 450px at 120% -10%, #dbd2c8 0%, transparent 70%),
				var(--bg);
			min-height: 100vh;
			position: relative;
			overflow: hidden;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 20px;
		}

		.login-container {
			width: 100%;
			max-width: 400px;
			background: var(--surface);
			border-radius: var(--radius-lg);
			padding: 40px 30px;
			box-shadow: var(--shadow);
		}

		.login-header {
			text-align: center;
			margin-bottom: 30px;
		}

		.login-header h1 {
			margin: 0 0 10px 0;
			font-size: 28px;
			color: var(--text);
			font-weight: 700;
		}

		.login-header p {
			margin: 0;
			color: var(--muted);
			font-size: 14px;
		}

		.form-group {
			margin-bottom: 20px;
		}

		.form-group label {
			display: block;
			margin-bottom: 8px;
			font-weight: 500;
			color: var(--text);
			font-size: 14px;
		}

		.form-group input {
			width: 100%;
			padding: 12px 16px;
			border: 1px solid var(--line);
			border-radius: var(--radius-sm);
			font-family: "Manrope", sans-serif;
			font-size: 14px;
			color: var(--text);
			transition: border-color 0.3s ease, box-shadow 0.3s ease;
		}

		.form-group input:focus {
			outline: none;
			border-color: var(--brand);
			box-shadow: 0 0 0 3px rgba(201, 109, 29, 0.1);
		}

		.remember-forgot {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 20px;
			font-size: 13px;
		}

		.remember-forgot a {
			color: var(--brand);
			text-decoration: none;
			font-weight: 500;
		}

		.remember-forgot a:hover {
			text-decoration: underline;
		}

		.login-btn {
			width: 100%;
			padding: 14px 16px;
			background: var(--brand);
			color: white;
			border: none;
			border-radius: var(--radius-sm);
			font-family: "Manrope", sans-serif;
			font-size: 15px;
			font-weight: 600;
			cursor: pointer;
			transition: background-color 0.3s ease;
		}

		.login-btn:hover {
			background-color: var(--accent);
		}

		.login-btn:active {
			transform: scale(0.98);
		}

		.signup-link {
			text-align: center;
			margin-top: 20px;
			color: var(--muted);
			font-size: 13px;
		}

		.signup-link a {
			color: var(--brand);
			text-decoration: none;
			font-weight: 600;
		}

		.signup-link a:hover {
			text-decoration: underline;
		}

		.error-message {
			display: none;
			background-color: #fee;
			border: 1px solid #fcc;
			color: #c33;
			padding: 12px 16px;
			border-radius: var(--radius-sm);
			margin-bottom: 20px;
			font-size: 13px;
		}

		.success-message {
			display: none;
			background-color: #efe;
			border: 1px solid #cfc;
			color: #3a3;
			padding: 12px 16px;
			border-radius: var(--radius-sm);
			margin-bottom: 20px;
			font-size: 13px;
		}

		.loading {
			display: none;
			text-align: center;
			color: var(--muted);
			font-size: 13px;
		}

		/* Mobile Responsive */
		@media (max-width: 768px) {
			body {
				padding: 10px;
			}

			.login-container {
				padding: 30px 20px;
				border-radius: 16px;
			}

			.login-header h1 {
				font-size: clamp(22px, 6vw, 28px);
				margin-bottom: 8px;
			}

			.login-header p {
				font-size: clamp(12px, 3vw, 14px);
			}

			.form-group {
				margin-bottom: 16px;
			}

			.form-group label {
				font-size: clamp(13px, 2.5vw, 14px);
				margin-bottom: 6px;
			}

			.form-group input {
				padding: 14px 14px;
				font-size: 16px;
				border-radius: 10px;
			}

			.remember-forgot {
				flex-direction: column;
				align-items: flex-start;
				gap: 10px;
				font-size: clamp(12px, 2vw, 13px);
				margin-bottom: 16px;
			}

			.remember-forgot label {
				margin: 0;
			}

			.login-btn {
				padding: 16px 14px;
				font-size: 16px;
				font-weight: 700;
				border-radius: 10px;
				min-height: 48px;
				-webkit-appearance: none;
				appearance: none;
			}

			.login-btn:active {
				transform: scale(0.95);
			}

			.signup-link {
				margin-top: 16px;
				font-size: clamp(12px, 2vw, 13px);
			}

			.error-message,
			.success-message {
				padding: 12px 14px;
				font-size: 12px;
				border-radius: 10px;
				margin-bottom: 16px;
			}
		}

		@media (max-width: 480px) {
			.login-container {
				max-width: 100%;
				padding: 25px 16px;
				border-radius: 14px;
			}

			.login-header {
				margin-bottom: 24px;
			}

			.login-header h1 {
				font-size: 24px;
			}

			.form-group input {
				font-size: 16px;
				padding: 14px 12px;
			}

			.form-group {
				margin-bottom: 14px;
			}

			.remember-forgot {
				gap: 8px;
			}

			.login-btn {
				min-height: 50px;
				font-size: 16px;
			}
		}

		/* Touch-friendly improvements */
		@media (hover: none) and (pointer: coarse) {
			input,
			button {
				font-size: 16px;
			}

			.login-btn {
				min-height: 48px;
			}

			.remember-forgot a {
				padding: 4px 0;
			}
		}
	</style>
</head>
<body class="relative flex min-h-screen items-center justify-center overflow-hidden p-4 font-['Manrope',sans-serif] text-[#101010] sm:p-5">
	<img src="bg.gif" alt="" aria-hidden="true" class="pointer-events-none fixed inset-0 -z-20 h-full w-full object-cover object-center" />
	<div class="absolute inset-0 -z-10 bg-black/40" aria-hidden="true"></div>
	<div class="relative z-10 w-full max-w-md rounded-[26px] bg-[#f5f5f5]/95 px-6 py-8 shadow-[0_14px_35px_rgba(0,0,0,0.14)] backdrop-blur-sm sm:px-8 sm:py-10">
		<div class="mb-8 text-center sm:mb-9">
			<h1 class="mb-2 text-[clamp(24px,5vw,30px)] font-bold text-[#101010]">Dara Catering</h1>
			<p class="text-sm text-[#5e5e5e]">Masuk ke akun Anda</p>
		</div>

		<div id="errorMessage" class="mb-5 hidden rounded-[12px] border border-[#fcc] bg-[#fee] px-4 py-3 text-sm text-[#c33]"></div>
		<div id="successMessage" class="mb-5 hidden rounded-[12px] border border-[#cfc] bg-[#efe] px-4 py-3 text-sm text-[#3a3]"></div>

		<form id="loginForm" class="space-y-5">
			<div class="space-y-2">
				<label for="email" class="block text-sm font-medium text-[#101010]">Email</label>
				<input
					type="email"
					id="email"
					name="email"
					placeholder="Masukkan email"
					inputmode="email"
					autocomplete="email"
					required
					class="w-full rounded-[12px] border border-[#d6d6d6] bg-white px-4 py-3 text-sm text-[#101010] outline-none transition focus:border-[#c96d1d] focus:ring-4 focus:ring-[rgba(201,109,29,0.12)] sm:py-3.5 sm:text-base"
				/>
			</div>

			<div class="space-y-2">
				<label for="password" class="block text-sm font-medium text-[#101010]">Kata Sandi</label>
				<input
					type="password"
					id="password"
					name="password"
					placeholder="Masukkan kata sandi"
					autocomplete="current-password"
					required
					class="w-full rounded-[12px] border border-[#d6d6d6] bg-white px-4 py-3 text-sm text-[#101010] outline-none transition focus:border-[#c96d1d] focus:ring-4 focus:ring-[rgba(201,109,29,0.12)] sm:py-3.5 sm:text-base"
				/>
			</div>

			<div class="flex flex-col gap-3 text-sm sm:flex-row sm:items-center sm:justify-between">
				<label class="flex cursor-pointer items-center gap-2 text-[#101010]">
					<input
						type="checkbox"
						id="remember"
						name="remember"
						class="h-[18px] w-[18px] cursor-pointer rounded border-[#d6d6d6] text-[#c96d1d] focus:ring-[#c96d1d]"
					/>
					<span>Ingat saya</span>
				</label>
				<a href="#" class="font-medium text-[#c96d1d] hover:underline">Lupa kata sandi?</a>
			</div>

			<button
				type="submit"
				class="inline-flex w-full items-center justify-center rounded-[12px] bg-[#c96d1d] px-4 py-3.5 text-sm font-semibold text-white transition hover:bg-[#8b2f16] active:scale-[0.98] disabled:cursor-not-allowed disabled:opacity-70 sm:text-base"
				id="loginBtn"
			>
				Masuk
			</button>
		</form>

		<div class="mt-5 text-center text-sm text-[#5e5e5e]">
			Belum punya akun? <a href="/home.html" class="font-semibold text-[#c96d1d] hover:underline">Kembali ke halaman utama</a>
		</div>
	</div>

	<script>
		const loginForm = document.getElementById('loginForm');
		const loginBtn = document.getElementById('loginBtn');
		const errorMessage = document.getElementById('errorMessage');
		const successMessage = document.getElementById('successMessage');

		loginForm.addEventListener('submit', async (e) => {
			e.preventDefault();

			// Clear previous messages
			errorMessage.style.display = 'none';
			successMessage.style.display = 'none';
			errorMessage.textContent = '';
			successMessage.textContent = '';

			const email = document.getElementById('email').value;
			const password = document.getElementById('password').value;

			// Disable button and show loading state
			loginBtn.disabled = true;
			loginBtn.textContent = 'Sedang memproses...';

			try {
				const response = await fetch('/api/auth.php', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json',
					},
					body: JSON.stringify({
						email: email,
						password: password,
					}),
				});

				const data = await response.json();

				if (data.success) {
					successMessage.textContent = 'Login berhasil! Mengalihkan...';
					successMessage.style.display = 'block';
					
					// Store user info
					localStorage.setItem('user', JSON.stringify(data.user));
					
					// Redirect based on role
					let redirectUrl = '/home.html';
					if (data.user && data.user.role === 'admin') {
						redirectUrl = '/ADMINDara.html';
					}
					
					// Redirect after a short delay
					setTimeout(() => {
						window.location.href = redirectUrl;
					}, 1000);
				} else {
					errorMessage.textContent = data.message || 'Email atau kata sandi salah';
					errorMessage.style.display = 'block';
					loginBtn.disabled = false;
					loginBtn.textContent = 'Masuk';
				}
			} catch (error) {
				errorMessage.textContent = 'Terjadi kesalahan. Silakan coba lagi.';
				errorMessage.style.display = 'block';
				loginBtn.disabled = false;
				loginBtn.textContent = 'Masuk';
				console.error('Login error:', error);
			}
		});
	</script>
</body>
</html>
