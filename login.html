<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Login - Dara Catering</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=block" rel="stylesheet" />
	<style>
		:root {
			--bg: #ffc57a;
			--surface: #f5f5f5;
			--surface-2: #ececec;
			--brand: #c96d1d;
			--text: #101010;
			--muted: #5e5e5e;
			--line: #d6d6d6;
			--accent: #8b2f16;
			--good: #0a7b41;
			--radius-lg: 26px;
			--radius-md: 18px;
			--radius-sm: 12px;
			--shadow: 0 14px 35px rgba(0, 0, 0, 0.14);
		}

		* {
			box-sizing: border-box;
		}

		html {
			scroll-behavior: smooth;
		}

		body {
			margin: 0;
			font-family: "Manrope", sans-serif;
			color: var(--text);
			background:
				radial-gradient(1000px 500px at -20% 10%, #ece2d4 0%, transparent 70%),
				radial-gradient(900px 450px at 120% -10%, #dbd2c8 0%, transparent 70%),
				var(--bg);
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 20px;
		}

		.login-container {
			width: 100%;
			max-width: 400px;
			background: var(--surface);
			border-radius: var(--radius-lg);
			padding: 40px 30px;
			box-shadow: var(--shadow);
		}

		.login-header {
			text-align: center;
			margin-bottom: 30px;
		}

		.login-header h1 {
			margin: 0 0 10px 0;
			font-size: 28px;
			color: var(--text);
			font-weight: 700;
		}

		.login-header p {
			margin: 0;
			color: var(--muted);
			font-size: 14px;
		}

		.form-group {
			margin-bottom: 20px;
		}

		.form-group label {
			display: block;
			margin-bottom: 8px;
			font-weight: 500;
			color: var(--text);
			font-size: 14px;
		}

		.form-group input {
			width: 100%;
			padding: 12px 16px;
			border: 1px solid var(--line);
			border-radius: var(--radius-sm);
			font-family: "Manrope", sans-serif;
			font-size: 14px;
			color: var(--text);
			transition: border-color 0.3s ease, box-shadow 0.3s ease;
		}

		.form-group input:focus {
			outline: none;
			border-color: var(--brand);
			box-shadow: 0 0 0 3px rgba(201, 109, 29, 0.1);
		}

		.remember-forgot {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 20px;
			font-size: 13px;
		}

		.remember-forgot a {
			color: var(--brand);
			text-decoration: none;
			font-weight: 500;
		}

		.remember-forgot a:hover {
			text-decoration: underline;
		}

		.login-btn {
			width: 100%;
			padding: 14px 16px;
			background: var(--brand);
			color: white;
			border: none;
			border-radius: var(--radius-sm);
			font-family: "Manrope", sans-serif;
			font-size: 15px;
			font-weight: 600;
			cursor: pointer;
			transition: background-color 0.3s ease;
		}

		.login-btn:hover {
			background-color: var(--accent);
		}

		.login-btn:active {
			transform: scale(0.98);
		}

		.signup-link {
			text-align: center;
			margin-top: 20px;
			color: var(--muted);
			font-size: 13px;
		}

		.signup-link a {
			color: var(--brand);
			text-decoration: none;
			font-weight: 600;
		}

		.signup-link a:hover {
			text-decoration: underline;
		}

		.error-message {
			display: none;
			background-color: #fee;
			border: 1px solid #fcc;
			color: #c33;
			padding: 12px 16px;
			border-radius: var(--radius-sm);
			margin-bottom: 20px;
			font-size: 13px;
		}

		.success-message {
			display: none;
			background-color: #efe;
			border: 1px solid #cfc;
			color: #3a3;
			padding: 12px 16px;
			border-radius: var(--radius-sm);
			margin-bottom: 20px;
			font-size: 13px;
		}

		.loading {
			display: none;
			text-align: center;
			color: var(--muted);
			font-size: 13px;
		}

		/* Mobile Responsive */
		@media (max-width: 768px) {
			body {
				padding: 10px;
			}

			.login-container {
				padding: 30px 20px;
				border-radius: 16px;
			}

			.login-header h1 {
				font-size: clamp(22px, 6vw, 28px);
				margin-bottom: 8px;
			}

			.login-header p {
				font-size: clamp(12px, 3vw, 14px);
			}

			.form-group {
				margin-bottom: 16px;
			}

			.form-group label {
				font-size: clamp(13px, 2.5vw, 14px);
				margin-bottom: 6px;
			}

			.form-group input {
				padding: 14px 14px;
				font-size: 16px;
				border-radius: 10px;
			}

			.remember-forgot {
				flex-direction: column;
				align-items: flex-start;
				gap: 10px;
				font-size: clamp(12px, 2vw, 13px);
				margin-bottom: 16px;
			}

			.remember-forgot label {
				margin: 0;
			}

			.login-btn {
				padding: 16px 14px;
				font-size: 16px;
				font-weight: 700;
				border-radius: 10px;
				min-height: 48px;
				-webkit-appearance: none;
				appearance: none;
			}

			.login-btn:active {
				transform: scale(0.95);
			}

			.signup-link {
				margin-top: 16px;
				font-size: clamp(12px, 2vw, 13px);
			}

			.error-message,
			.success-message {
				padding: 12px 14px;
				font-size: 12px;
				border-radius: 10px;
				margin-bottom: 16px;
			}
		}

		@media (max-width: 480px) {
			.login-container {
				max-width: 100%;
				padding: 25px 16px;
				border-radius: 14px;
			}

			.login-header {
				margin-bottom: 24px;
			}

			.login-header h1 {
				font-size: 24px;
			}

			.form-group input {
				font-size: 16px;
				padding: 14px 12px;
			}

			.form-group {
				margin-bottom: 14px;
			}

			.remember-forgot {
				gap: 8px;
			}

			.login-btn {
				min-height: 50px;
				font-size: 16px;
			}
		}

		/* Touch-friendly improvements */
		@media (hover: none) and (pointer: coarse) {
			input,
			button {
				font-size: 16px;
			}

			.login-btn {
				min-height: 48px;
			}

			.remember-forgot a {
				padding: 4px 0;
			}
		}
	</style>
</head>
<body>
	<div class="login-container">
		<div class="login-header">
			<h1>Dara Catering</h1>
			<p>Masuk ke akun Anda</p>
		</div>

		<div id="errorMessage" class="error-message"></div>
		<div id="successMessage" class="success-message"></div>

		<form id="loginForm">
			<div class="form-group">
				<label for="email">Email</label>
				<input 
					type="email" 
					id="email" 
					name="email" 
					placeholder="Masukkan email" 
					inputmode="email"
					autocomplete="email"
					required 
				/>
			</div>

			<div class="form-group">
				<label for="password">Kata Sandi</label>
				<input 
					type="password" 
					id="password" 
					name="password" 
					placeholder="Masukkan kata sandi" 
					autocomplete="current-password"
					required 
				/>
			</div>

			<div class="remember-forgot">
				<label style="display: flex; align-items: center; cursor: pointer; gap: 8px;">
					<input 
						type="checkbox" 
						id="remember" 
						name="remember" 
						style="cursor: pointer; width: 18px; height: 18px;" 
					/>
					<span>Ingat saya</span>
				</label>
				<a href="#">Lupa kata sandi?</a>
			</div>

			<button type="submit" class="login-btn" id="loginBtn">Masuk</button>
		</form>

		<div class="signup-link">
			Belum punya akun? <a href="/home.html">Kembali ke halaman utama</a>
		</div>
	</div>

	<script>
		const loginForm = document.getElementById('loginForm');
		const loginBtn = document.getElementById('loginBtn');
		const errorMessage = document.getElementById('errorMessage');
		const successMessage = document.getElementById('successMessage');

		loginForm.addEventListener('submit', async (e) => {
			e.preventDefault();

			// Clear previous messages
			errorMessage.style.display = 'none';
			successMessage.style.display = 'none';
			errorMessage.textContent = '';
			successMessage.textContent = '';

			const email = document.getElementById('email').value;
			const password = document.getElementById('password').value;

			// Disable button and show loading state
			loginBtn.disabled = true;
			loginBtn.textContent = 'Sedang memproses...';

			try {
				const response = await fetch('/api/auth.php', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json',
					},
					body: JSON.stringify({
						email: email,
						password: password,
					}),
				});

				const data = await response.json();

				if (data.success) {
					successMessage.textContent = 'Login berhasil! Mengalihkan...';
					successMessage.style.display = 'block';
					
					// Store user info
					localStorage.setItem('user', JSON.stringify(data.user));
					
					// Redirect based on role
					let redirectUrl = '/home.html';
					if (data.user && data.user.role === 'admin') {
						redirectUrl = '/ADMINDara.html';
					}
					
					// Redirect after a short delay
					setTimeout(() => {
						window.location.href = redirectUrl;
					}, 1000);
				} else {
					errorMessage.textContent = data.message || 'Email atau kata sandi salah';
					errorMessage.style.display = 'block';
					loginBtn.disabled = false;
					loginBtn.textContent = 'Masuk';
				}
			} catch (error) {
				errorMessage.textContent = 'Terjadi kesalahan. Silakan coba lagi.';
				errorMessage.style.display = 'block';
				loginBtn.disabled = false;
				loginBtn.textContent = 'Masuk';
				console.error('Login error:', error);
			}
		});
	</script>
</body>
</html>
