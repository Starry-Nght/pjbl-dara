<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Profil - Dara Catering</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=block" rel="stylesheet" />
	<style>
		:root {
			--bg: #d1d1d3;
			--surface: #f6f2eb;
			--surface-2: #efe7dd;
			--brand: #c96d1d;
			--brand-dark: #8b4212;
			--text: #161616;
			--muted: #6c665f;
			--line: rgba(28, 20, 12, 0.12);
			--shadow: 0 18px 36px rgba(0, 0, 0, 0.12);
			--radius-xl: 28px;
			--radius-lg: 22px;
			--radius-md: 16px;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			font-family: "Manrope", sans-serif;
			color: var(--text);
			background:
				radial-gradient(900px 500px at 18% 6%, #e6dfd2 0%, transparent 64%),
				radial-gradient(900px 500px at 110% 0%, #d8cbbd 0%, transparent 60%),
				var(--bg);
			min-height: 100vh;
			padding: 24px;
		}

		.shell {
			max-width: 980px;
			margin: 0 auto;
			background: rgba(255, 255, 255, 0.32);
			backdrop-filter: blur(10px);
			border: 1px solid rgba(255, 255, 255, 0.42);
			border-radius: var(--radius-xl);
			box-shadow: var(--shadow);
			overflow: hidden;
		}

		.topbar {
			display: flex;
			justify-content: space-between;
			align-items: center;
			gap: 16px;
			padding: 18px 22px;
			background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
			color: #fff3e0;
		}

		.brand {
			text-decoration: none;
			color: inherit;
			font-weight: 800;
			letter-spacing: -0.02em;
		}

		.actions {
			display: flex;
			gap: 10px;
			flex-wrap: wrap;
		}

		.actions a,
		.actions button {
			border: 0;
			border-radius: 999px;
			padding: 10px 14px;
			font: inherit;
			font-weight: 800;
			text-decoration: none;
			cursor: pointer;
		}

		.actions a {
			background: rgba(255, 255, 255, 0.16);
			color: #fff;
		}

		.actions button {
			background: #fff;
			color: var(--brand-dark);
		}

		.content {
			display: grid;
			grid-template-columns: 280px 1fr;
			gap: 22px;
			padding: 22px;
		}

		.card {
			background: rgba(255, 255, 255, 0.7);
			border: 1px solid var(--line);
			border-radius: var(--radius-lg);
			padding: 20px;
			box-shadow: 0 12px 24px rgba(0, 0, 0, 0.06);
		}

		.profile-hero {
			display: grid;
			place-items: center;
			text-align: center;
			gap: 12px;
		}

		.avatar {
			width: 92px;
			height: 92px;
			border-radius: 50%;
			background: linear-gradient(135deg, #f5c58f, #c96d1d);
			color: white;
			display: grid;
			place-items: center;
			font-size: 2rem;
			font-weight: 800;
			box-shadow: 0 12px 24px rgba(201, 109, 29, 0.28);
		}

		h1,
		h2,
		p {
			margin: 0;
		}

		.muted {
			color: var(--muted);
			line-height: 1.6;
		}

		.info-grid {
			display: grid;
			gap: 14px;
		}

		.info-row {
			display: grid;
			gap: 6px;
			padding: 14px 16px;
			border-radius: 14px;
			background: var(--surface-2);
		}

		.info-row span {
			font-size: 0.84rem;
			color: var(--muted);
			font-weight: 700;
		}

		.info-row strong {
			font-size: 1rem;
		}

		.empty-state {
			display: grid;
			gap: 14px;
		}

		.empty-state a {
			display: inline-flex;
			width: fit-content;
			padding: 11px 16px;
			border-radius: 999px;
			background: var(--brand);
			color: #fff;
			text-decoration: none;
			font-weight: 800;
		}

		@media (max-width: 820px) {
			body {
				padding: 14px;
			}

			.content {
				grid-template-columns: 1fr;
			}

			.topbar {
				align-items: flex-start;
				flex-direction: column;
			}
		}
	</style>
</head>
<body>
	<div class="shell">
		<div class="topbar">
			<a class="brand" href="/home.html">Dara Catering</a>
			<div class="actions">
				<a href="/home.html">Kembali ke Home</a>
				<button type="button" id="logoutBtn">Keluar</button>
			</div>
		</div>

		<main class="content">
			<section class="card profile-hero">
				<div class="avatar" id="avatar">P</div>
				<div>
					<h1 id="displayName">Profil Pengguna</h1>
					<p class="muted" id="displayRole">Belum login</p>
				</div>
			</section>

			<section class="card">
				<h2>Informasi Akun</h2>
				<p class="muted" style="margin-top: 8px;">Data ini diambil dari sesi login yang tersimpan di browser.</p>

				<div class="info-grid" style="margin-top: 18px;">
					<div class="info-row">
						<span>Nama</span>
						<strong id="nameField">-</strong>
					</div>
					<div class="info-row">
						<span>Email</span>
						<strong id="emailField">-</strong>
					</div>
					<div class="info-row">
						<span>Role</span>
						<strong id="roleField">-</strong>
					</div>
				</div>
			</section>
		</main>
	</div>

	<script>
		const avatar = document.getElementById("avatar");
		const displayName = document.getElementById("displayName");
		const displayRole = document.getElementById("displayRole");
		const nameField = document.getElementById("nameField");
		const emailField = document.getElementById("emailField");
		const roleField = document.getElementById("roleField");
		const logoutBtn = document.getElementById("logoutBtn");

		function getInitials(name) {
			return name
				.split(/\s+/)
				.filter(Boolean)
				.slice(0, 2)
				.map((part) => part.charAt(0).toUpperCase())
				.join("") || "P";
		}

		function renderProfile() {
			const storedUser = localStorage.getItem("user");
			if (!storedUser) {
				document.querySelector(".content").innerHTML = `
					<section class="card empty-state" style="grid-column: 1 / -1; max-width: 560px; margin: 0 auto; text-align: center;">
						<h1>Profil belum tersedia</h1>
						<p class="muted">Silakan login dulu untuk melihat halaman profil.</p>
						<a href="/login.html">Ke halaman login</a>
					</section>
				`;
				logoutBtn.textContent = "Login";
				logoutBtn.addEventListener("click", () => {
					window.location.href = "/login.html";
				});
				return;
			}

			const user = JSON.parse(storedUser);
			const name = user?.name || user?.email || "Pengguna";
			const role = user?.role || "member";
			const email = user?.email || "-";

			const roleLabel = role === "admin" ? "Admin" : "Member";

			avatar.textContent = getInitials(name);
			displayName.textContent = name;
			displayRole.textContent = roleLabel;
			nameField.textContent = name;
			emailField.textContent = email;
			roleField.textContent = roleLabel;

			logoutBtn.addEventListener("click", () => {
				localStorage.removeItem("user");
				window.location.href = "/login.html";
			});
		}

		renderProfile();
	</script>
</body>
</html>
